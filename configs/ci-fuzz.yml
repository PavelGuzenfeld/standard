name: Fuzz Testing

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  fuzz:
    uses: PavelGuzenfeld/standard/.github/workflows/fuzz.yml@main
    with:
      mode: ${{ github.event_name == 'schedule' && 'batch' || 'code-change' }}
