reason = "No fixed deepmerge release; 4.3.1 is the latest, and renovate pins it exactly. Renovate uses it to merge its own config objects, and this harness only runs renovate-config-validator in CI over a renovate.json this repo generates, so no attacker-controlled object is merged. The tool is test-only and never shipped to consumers."
