site_name: standard
site_description: Reusable GitHub Actions for C++ and Python quality gates.
site_url: https://pavelguzenfeld.com/standard/
repo_url: https://github.com/PavelGuzenfeld/standard
repo_name: PavelGuzenfeld/standard
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quickstart: CONSUMER-QUICKSTART.md
  - Usage: usage.md
  - Integration: INTEGRATION.md
  - Workflows:
      - Overview: workflows/index.md
      - C++ quality: workflows/cpp-quality.md
      - Infra lint: workflows/infra-lint.md
      - Python quality: workflows/python-quality.md
      - Python SAST: workflows/sast-python.md
      - SBOM: workflows/sbom.md
      - Fuzzing: workflows/fuzz.md
      - Version check and release: workflows/release.md
      - Trend dashboard: workflows/trend-dashboard.md
      - Compliance and CIS: workflows/compliance.md
      - Install test: workflows/install-test.md
      - Scheduled health: workflows/scheduled-health.md
      - Pre-commit: workflows/pre-commit.md
      - Version sync: workflows/version-sync.md
  - Configs: configs.md
  - Scripts: scripts.md
  - CLI: cli.md
  - Gate and PR checks: SDLC.md
  - Compliance: COMPLIANCE.md
  - Versioning: VERSIONING.md
  - Conventions: conventions.md
