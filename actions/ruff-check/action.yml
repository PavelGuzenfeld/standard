name: 'Ruff Check'
description: 'Run diff-aware Python linting with ruff via diff-quality'

inputs:
  python_version:
    description: 'Python version to use'
    default: '3.12'
  base_ref:
    description: 'Base branch for diff comparison'
    default: ''
  fail_under:
    description: 'Minimum diff-quality score (0-100)'
    default: '100'
  ruff_version:
    description: 'Ruff version to install (pin to avoid breaking changes)'
    default: '0.16.9'
  diff_cover_version:
    description: 'diff-cover version to install (empty picks 10.5.1, or 9.2.0 on Python below 3.10, which has no ruff.check driver)'
    default: ''
  ruff_select:
    description: 'Comma-separated ruff rule selectors (e.g. E,W,F,I)'
    default: 'E,W,F,I,N'
  ruff_ignore:
    description: 'Comma-separated ruff rules to ignore'
    default: ''
  line_length:
    description: 'Maximum line length for ruff'
    default: ''
  target_python:
    description: 'Target Python version for ruff (e.g. py312)'
    default: ''

outputs:
  passed:
    description: 'Whether the check passed'
    value: ${{ steps.lint.outputs.passed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}

    - shell: bash
      env:
        RUFF_VERSION: ${{ inputs.ruff_version }}
        DIFF_COVER_VERSION: ${{ inputs.diff_cover_version }}
      run: |
        if [ -z "$DIFF_COVER_VERSION" ]; then
          if python -c 'import sys; sys.exit(sys.version_info >= (3, 10))'; then
            DIFF_COVER_VERSION=9.2.0
          else
            DIFF_COVER_VERSION=10.5.1
          fi
        fi
        pip install "ruff==$RUFF_VERSION" "diff-cover==$DIFF_COVER_VERSION"

    - id: lint
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref || github.base_ref || 'main' }}
        RUFF_SELECT: ${{ inputs.ruff_select }}
        RUFF_IGNORE: ${{ inputs.ruff_ignore }}
        LINE_LENGTH: ${{ inputs.line_length }}
        TARGET_PYTHON: ${{ inputs.target_python }}
        FAIL_UNDER: ${{ inputs.fail_under }}
      run: |
        if ! diff-quality --help | grep -q "ruff.check"; then
          echo "::error::installed diff-cover has no ruff.check driver (needs Python 3.10+); use a newer python_version"
          exit 1
        fi

        RUFF_ARGS=""
        if [ -n "$RUFF_SELECT" ]; then
          RUFF_ARGS="$RUFF_ARGS --select=$RUFF_SELECT"
        fi
        if [ -n "$RUFF_IGNORE" ]; then
          RUFF_ARGS="$RUFF_ARGS --ignore=$RUFF_IGNORE"
        fi
        if [ -n "$LINE_LENGTH" ]; then
          RUFF_ARGS="$RUFF_ARGS --line-length=$LINE_LENGTH"
        fi
        if [ -n "$TARGET_PYTHON" ]; then
          RUFF_ARGS="$RUFF_ARGS --target-version=$TARGET_PYTHON"
        fi

        if diff-quality --violations=ruff.check \
          --options="${RUFF_ARGS}" \
          --compare-branch="origin/${BASE_REF}" \
          --fail-under="$FAIL_UNDER"; then
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "ruff: diff-quality passed"
        else
          echo "passed=false" >> $GITHUB_OUTPUT
          echo "ruff: diff-quality failed"
          exit 1
        fi
