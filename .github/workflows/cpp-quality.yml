                ]
              }
            }
          }
          EOF
          npm ci --ignore-scripts

      - name: Run jscpd on changed files
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref || github.base_ref || 'main' }}
          INPUT_FILE_EXTENSIONS: ${{ inputs.file_extensions }}
          INPUT_EXCLUDE_FILE: ${{ inputs.exclude_file }}
          INPUT_JSCPD_THRESHOLD: ${{ inputs.jscpd_threshold }}
          INPUT_JSCPD_REPORT_ONLY: ${{ inputs.jscpd_report_only }}
        run: |
          EXT_PATTERN="\.($(echo "${INPUT_FILE_EXTENSIONS}" | tr ' ' '|'))$"
          FILES=()
          while IFS= read -r fp; do
            [ -z "$fp" ] && continue
            excl=false
            if [ -n "${INPUT_EXCLUDE_FILE}" ] && [ -f "${INPUT_EXCLUDE_FILE}" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                line="${line%%#*}"; line="$(echo "$line" | xargs)"
                [ -n "$line" ] && [[ "$fp" == "$line"* ]] && excl=true && break
              done < "${INPUT_EXCLUDE_FILE}"
            fi
            [ "$excl" = false ] && FILES+=("$fp")
          done < <(git diff --name-only --diff-filter=ACMR "origin/${INPUT_BASE_REF}" -- | grep -E "$EXT_PATTERN" || true)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No C++ files changed."
            exit 0
          fi

          STATUS=0
          "$RUNNER_TEMP/jscpd/node_modules/.bin/jscpd" --threshold "${INPUT_JSCPD_THRESHOLD}" --reporters console "${FILES[@]}" || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::jscpd: duplication over ${INPUT_JSCPD_THRESHOLD}% in changed files"
            [ "${INPUT_JSCPD_REPORT_ONLY}" = "true" ] || exit 1
          fi

  summary:
    name: Post Summary
    runs-on: ${{ fromJSON(inputs.runner) }}
    needs: [verify-toolchain, clang-tidy, cppcheck, clang-format, doctest-enforce, file-naming, cout-ban, new-delete-ban, flawfinder, sanitizer-tests, tsan-tests, iwyu, coverage, hardening, jscpd, binskim]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- cpp-quality-report -->';
            const tidy = '${{ needs.clang-tidy.result }}';
            const check = '${{ needs.cppcheck.result }}';
            const format = '${{ needs.clang-format.result }}';
            const doctest = '${{ needs.doctest-enforce.result }}';
            const naming = '${{ needs.file-naming.result }}';
            const coutBan = '${{ needs.cout-ban.result }}';
            const newBan = '${{ needs.new-delete-ban.result }}';
            const flaw = '${{ needs.flawfinder.result }}';
            const sanitizer = '${{ needs.sanitizer-tests.result }}';
            const tsan = '${{ needs.tsan-tests.result }}';
            const iwyu = '${{ needs.iwyu.result }}';
            const coverage = '${{ needs.coverage.result }}';
            const hardening = '${{ needs.hardening.result }}';
            const jscpd = '${{ needs.jscpd.result }}';
            const binskim = '${{ needs.binskim.result }}';

            const icon = (r) => {
              if (r === 'success') return '✅';
              if (r === 'skipped') return '⏭️';
              if (r === 'failure') return '❌';
              return '⚠️';
            };

            let body = marker + '\n## C++ Quality Scoreboard\n\n';
            body += '| Check | Result |\n|:------|:------:|\n';
            body += `| clang-tidy | ${icon(tidy)} ${tidy === 'success' || tidy === 'skipped' ? 'clean' : 'issues found'} |\n`;
            body += `| cppcheck | ${icon(check)} ${check === 'success' || check === 'skipped' ? 'clean' : 'issues found'} |\n`;
            if (format && format !== 'skipped') {
              body += `| clang-format | ${icon(format)} ${format === 'success' ? 'clean' : 'formatting issues'} |\n`;
            }
            if (doctest && doctest !== 'skipped') {
              body += `| doctest enforcement | ${icon(doctest)} ${doctest === 'success' ? 'clean' : 'banned framework found'} |\n`;
            }
            if (naming && naming !== 'skipped') {
              body += `| file naming | ${icon(naming)} ${naming === 'success' ? 'clean' : 'naming violations'} |\n`;
            }
            if (coutBan && coutBan !== 'skipped') {
              body += `| cout/printf ban | ${icon(coutBan)} ${coutBan === 'success' ? 'clean' : 'banned I/O found'} |\n`;
            }
            if (newBan && newBan !== 'skipped') {
              body += `| new/delete ban | ${icon(newBan)} ${newBan === 'success' ? 'clean' : 'raw new/delete found'} |\n`;
            }
            if (flaw && flaw !== 'skipped') {
              body += `| flawfinder | ${icon(flaw)} ${flaw === 'success' ? 'clean' : 'CWE findings'} |\n`;
            }
            if (sanitizer && sanitizer !== 'skipped') {
              body += `| ASAN/UBSAN | ${icon(sanitizer)} ${sanitizer === 'success' ? 'clean' : 'sanitizer errors'} |\n`;
            }
            if (tsan && tsan !== 'skipped') {
              body += `| TSAN | ${icon(tsan)} ${tsan === 'success' ? 'clean' : 'thread-safety errors'} |\n`;
            }
            if (iwyu && iwyu !== 'skipped') {
              body += `| IWYU | ${icon(iwyu)} ${iwyu === 'success' ? 'clean' : 'unnecessary includes found'} |\n`;
            }
            if (coverage && coverage !== 'skipped') {
              body += `| Coverage | ${icon(coverage)} ${coverage === 'success' ? 'thresholds met' : 'below threshold'} |\n`;
            }
            if (hardening && hardening !== 'skipped') {
              body += `| Hardening | ${icon(hardening)} ${hardening === 'success' ? 'all checks pass' : 'hardening issues'} |\n`;
            }
            if (jscpd && jscpd !== 'skipped') {
              body += `| jscpd | ${icon(jscpd)} ${jscpd === 'success' ? 'clean' : 'duplication found'} |\n`;
            }
            if (binskim && binskim !== 'skipped') {
              body += `| BinSkim | ${icon(binskim)} ${binskim === 'success' ? 'clean' : 'binary findings'} |\n`;
            }
            body += '\n---\n<sub>Powered by <a href="https://github.com/PavelGuzenfeld/standard">standard</a> · Only changed files checked</sub>';

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }

  binskim:
    name: BinSkim
    needs: [verify-toolchain]
    if: inputs.enable_binskim && (inputs.select_jobs == 'all' || contains(inputs.select_jobs, 'binskim'))
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      BINSKIM_VERSION: 4.4.9.11
      BINSKIM_SHA256: 69678989cbc273b5b50fcf98fb0fd978e1e35a3f844acb24254b31f0ce90c447
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: ${{ inputs.checkout_submodules }}

      - name: Login to GitHub Container Registry
        if: inputs.docker_image != ''
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build hardened binaries
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_HARDENING_SCRIPT: ${{ inputs.hardening_script }}
          INPUT_SOURCE_MOUNT: ${{ inputs.source_mount }}
          INPUT_SOURCE_SETUP: ${{ inputs.source_setup }}
        run: |
          SETUP_CMD=""
          if [ -n "${INPUT_SOURCE_SETUP}" ]; then
            SETUP_CMD="${INPUT_SOURCE_SETUP} && "
          fi
          BUILD_CMD="cmake --preset release-hardened && cmake --build --preset release-hardened"
          if [ -n "${INPUT_HARDENING_SCRIPT}" ]; then
            BUILD_CMD="bash ${INPUT_HARDENING_SCRIPT}"
          fi
          docker run --rm \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "${SETUP_CMD}${BUILD_CMD}"

      - name: Install BinSkim
        run: |
          curl -fsSL -o binskim.nupkg \
            "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/${BINSKIM_VERSION}/microsoft.codeanalysis.binskim.${BINSKIM_VERSION}.nupkg"
          echo "${BINSKIM_SHA256}  binskim.nupkg" | sha256sum -c -
          case "$(uname -m)" in
            x86_64) RID=linux-x64 ;;
            aarch64) RID=linux-arm64 ;;
            *) echo "::error::BinSkim has no build for $(uname -m)"; exit 1 ;;
          esac
          unzip -q binskim.nupkg "tools/net9.0/${RID}/*" -d "${RUNNER_TEMP}/binskim"
          chmod +x "${RUNNER_TEMP}/binskim/tools/net9.0/${RID}/BinSkim"
          echo "${RUNNER_TEMP}/binskim/tools/net9.0/${RID}" >> "$GITHUB_PATH"

      - name: Run BinSkim
        env:
          INPUT_BINSKIM_PATHS: ${{ inputs.binskim_paths }}
        run: |
          read -ra TARGETS <<< "${INPUT_BINSKIM_PATHS}"
          BinSkim analyze "${TARGETS[@]}" --recurse --disable-telemetry --output binskim.sarif

      - name: Upload BinSkim SARIF
        if: always() && hashFiles('binskim.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binskim-sarif
          path: binskim.sarif

      - name: Fail on findings at or above level
        env:
          INPUT_BINSKIM_FAIL_LEVEL: ${{ inputs.binskim_fail_level }}
        run: |
          case "${INPUT_BINSKIM_FAIL_LEVEL}" in
            error) LEVELS='["error"]' ;;
            warning) LEVELS='["error","warning"]' ;;
            note) LEVELS='["error","warning","note"]' ;;
            *) echo "::error::binskim_fail_level must be error, warning or note"; exit 1 ;;
          esac
          COUNT=$(jq --argjson levels "${LEVELS}" \
            '[.runs[].results[] | select((.kind // "fail") == "fail" and (.level as $l | $levels | index($l)))] | length' \
            binskim.sarif)
          echo "BinSkim findings at level ${INPUT_BINSKIM_FAIL_LEVEL} or above: ${COUNT}"
          [ "${COUNT}" -eq 0 ]
