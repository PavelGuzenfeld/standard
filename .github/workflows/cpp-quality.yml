  hardening:
    name: Hardening Verification
    needs: [verify-toolchain]
    if: inputs.enable_hardening && (inputs.select_jobs == 'all' || contains(inputs.select_jobs, 'hardening'))
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: ${{ inputs.checkout_submodules }}

      - name: Login to GitHub Container Registry
        if: inputs.docker_image != ''
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare cache paths
        if: inputs.build_cache_key != ''
        id: cache-paths
        env:
          INPUT_BUILD_CACHE_PATHS: ${{ inputs.build_cache_paths }}
        run: |
          {
            echo "paths<<EOF"
            echo "${INPUT_BUILD_CACHE_PATHS}" | tr ' ' '\n'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        if: inputs.build_cache_key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: ${{ inputs.build_cache_key }}-hardening
          restore-keys: |
            ${{ inputs.build_cache_key }}-hardening-
            ${{ inputs.build_cache_key }}-

      - name: Run hardening script
        if: inputs.hardening_script != ''
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_HARDENING_SCRIPT: ${{ inputs.hardening_script }}
          INPUT_SOURCE_MOUNT: ${{ inputs.source_mount }}
          INPUT_SOURCE_SETUP: ${{ inputs.source_setup }}
        run: |
          SETUP_CMD=""
          if [ -n "${INPUT_SOURCE_SETUP}" ]; then
            SETUP_CMD="${INPUT_SOURCE_SETUP} && "
          fi
          docker run --rm \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "${SETUP_CMD}bash ${INPUT_HARDENING_SCRIPT}"

      - name: Build with hardening (default flow)
        if: inputs.hardening_script == ''
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_SOURCE_MOUNT: ${{ inputs.source_mount }}
          INPUT_SOURCE_SETUP: ${{ inputs.source_setup }}
        run: |
          SETUP_CMD=""
          if [ -n "${INPUT_SOURCE_SETUP}" ]; then
            SETUP_CMD="${INPUT_SOURCE_SETUP} && "
          fi
          docker run --rm \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "
              ${SETUP_CMD}
              cmake --preset release-hardened && cmake --build --preset release-hardened
            "

      - name: Verify hardening properties
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_HARDENING_BINARY_PATHS: ${{ inputs.hardening_binary_paths }}
          INPUT_HARDENING_SKIP_CHECKS: ${{ inputs.hardening_skip_checks }}
          INPUT_SOURCE_MOUNT: ${{ inputs.source_mount }}
          INPUT_SOURCE_SETUP: ${{ inputs.source_setup }}
        run: |
          SETUP_CMD=""
          if [ -n "${INPUT_SOURCE_SETUP}" ]; then
            SETUP_CMD="${INPUT_SOURCE_SETUP} && "
          fi

          SKIP_ARGS=""
          if [ -n "${INPUT_HARDENING_SKIP_CHECKS}" ]; then
            for check in ${INPUT_HARDENING_SKIP_CHECKS}; do
              SKIP_ARGS="$SKIP_ARGS --skip $check"
            done
          fi

          BINARY_PATHS="${INPUT_HARDENING_BINARY_PATHS}"

          docker run --rm \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "${SETUP_CMD}"'
              FAILURES=0
              WARNINGS=0
              BINARIES=()

              for pattern in '"$BINARY_PATHS"'; do
                for file in $pattern; do
                  [ -f "$file" ] || continue
                  if file "$file" 2>/dev/null | grep -q "ELF"; then
                    BINARIES+=("$file")
                  fi
                done
              done

              if [ ${#BINARIES[@]} -eq 0 ]; then
                echo "::error::No ELF binaries found matching: '"$BINARY_PATHS"'"
                exit 1
              fi

              echo "Checking ${#BINARIES[@]} ELF binary(ies)..."
              echo ""

              is_skipped() {
                local check="$1"
                for s in '"$SKIP_ARGS"'; do
                  [ "$s" = "--skip" ] && continue
                  [ "$s" = "$check" ] && return 0
                done
                return 1
              }

              for binary in "${BINARIES[@]}"; do
                echo "--- $binary ---"
                BIN_FAIL=0

                IS_SHARED=false
                if file "$binary" 2>/dev/null | grep -q "shared object"; then
                  IS_SHARED=true
                fi

                if ! is_skipped "pie"; then
                  if $IS_SHARED; then
                    echo "  PIE: SKIP (shared library)"
                  else
                    ELF_TYPE=$(readelf -h "$binary" 2>/dev/null | grep -oP "Type:\s+\K\S+" || echo "UNKNOWN")
                    if [ "$ELF_TYPE" = "DYN" ]; then
                      echo "  PIE: PASS"
                    else
                      echo "  PIE: FAIL (type: $ELF_TYPE)"
                      echo "::error file=$binary::PIE not enabled — ELF type is $ELF_TYPE, expected DYN"
                      BIN_FAIL=1
                    fi
                  fi
                fi

                if ! is_skipped "relro"; then
                  if readelf -l "$binary" 2>/dev/null | grep -q "GNU_RELRO"; then
                    echo "  RELRO: PASS"
                  else
                    echo "  RELRO: FAIL"
                    echo "::error file=$binary::No GNU_RELRO segment — RELRO not enabled"
                    BIN_FAIL=1
                  fi
                fi

                if ! is_skipped "bindnow"; then
                  if readelf -d "$binary" 2>/dev/null | grep -qE "\(BIND_NOW\)"; then
                    echo "  BIND_NOW: PASS"
                  else
                    echo "  BIND_NOW: FAIL"
                    echo "::error file=$binary::No BIND_NOW flag — only Partial RELRO"
                    BIN_FAIL=1
                  fi
                fi

                if ! is_skipped "canary"; then
                  if readelf -s "$binary" 2>/dev/null | grep -q "__stack_chk_fail"; then
                    echo "  CANARY: PASS"
                  else
                    echo "  CANARY: FAIL"
                    echo "::error file=$binary::No __stack_chk_fail symbol — stack protector missing"
                    BIN_FAIL=1
                  fi
                fi

                if ! is_skipped "fortify"; then
                  if readelf -s "$binary" 2>/dev/null | grep -qE "__\w+_chk"; then
                    echo "  FORTIFY: PASS"
                  else
                    echo "  FORTIFY: WARN (no fortified functions)"
                    echo "::warning file=$binary::No __*_chk symbols — binary may not use fortifiable functions"
                    WARNINGS=$((WARNINGS + 1))
                  fi
                fi

                if ! is_skipped "nx"; then
                  STACK_LINE=$(readelf -l "$binary" 2>/dev/null | grep "GNU_STACK" || true)
                  if [ -z "$STACK_LINE" ]; then
                    echo "  NX: FAIL (no GNU_STACK)"
                    echo "::error file=$binary::No GNU_STACK segment"
                    BIN_FAIL=1
                  elif echo "$STACK_LINE" | grep -qE "RWE"; then
                    echo "  NX: FAIL (executable stack)"
                    echo "::error file=$binary::GNU_STACK has execute flag — stack is executable"
                    BIN_FAIL=1
                  else
                    echo "  NX: PASS"
                  fi
                fi

                # CET check (x86-64: IBT + SHSTK via -fcf-protection)
                if ! is_skipped "cet"; then
                  NOTE_PROPS=$(readelf -n "$binary" 2>/dev/null | grep -i "x86 feature:" || true)
                  if [ -z "$NOTE_PROPS" ]; then
                    echo "  CET: FAIL (no x86 feature properties)"
                    echo "::error file=$binary::No CET properties — missing -fcf-protection"
                    BIN_FAIL=1
                  elif echo "$NOTE_PROPS" | grep -q "IBT" && echo "$NOTE_PROPS" | grep -q "SHSTK"; then
                    echo "  CET: PASS (IBT + SHSTK)"
                  elif echo "$NOTE_PROPS" | grep -q "IBT"; then
                    echo "  CET: WARN (IBT only — missing SHSTK)"
                    echo "::warning file=$binary::CET partial — IBT only, use -fcf-protection=full"
                    WARNINGS=$((WARNINGS + 1))
                  elif echo "$NOTE_PROPS" | grep -q "SHSTK"; then
                    echo "  CET: WARN (SHSTK only — missing IBT)"
                    echo "::warning file=$binary::CET partial — SHSTK only, use -fcf-protection=full"
                    WARNINGS=$((WARNINGS + 1))
                  else
                    echo "  CET: FAIL (properties present but no IBT/SHSTK)"
                    echo "::error file=$binary::CET features missing in .note.gnu.property"
                    BIN_FAIL=1
                  fi
                fi

                [ $BIN_FAIL -gt 0 ] && FAILURES=$((FAILURES + 1))
                echo ""
              done

              echo "========================================"
              echo "  Binaries: ${#BINARIES[@]}, Failures: $FAILURES, Warnings: $WARNINGS"
              echo "========================================"

              [ $FAILURES -gt 0 ] && exit 1
              exit 0
            '

  jscpd:
