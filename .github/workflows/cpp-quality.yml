        if: inputs.sanitizer_script == ''
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_SANITIZER_PACKAGES: ${{ inputs.sanitizer_packages }}
          INPUT_SOURCE_MOUNT: ${{ inputs.source_mount }}
          INPUT_SOURCE_SETUP: ${{ inputs.source_setup }}
        run: |
          SETUP_CMD=""
          if [ -n "${INPUT_SOURCE_SETUP}" ]; then
            SETUP_CMD="${INPUT_SOURCE_SETUP} && "
          fi
          PACKAGES_ARG=""
          if [ -n "${INPUT_SANITIZER_PACKAGES}" ]; then
            PACKAGES_ARG="--packages-select ${INPUT_SANITIZER_PACKAGES}"
          fi
          docker run --rm \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "
              ${SETUP_CMD}
              colcon build \
                --cmake-args \
                  -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all' \
                  -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all' \
                  -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
                  -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined' \
                --event-handlers console_cohesion+ \
                --continue-on-error \
                $PACKAGES_ARG
            "

      - name: Run tests under sanitizers (default flow)
        if: inputs.sanitizer_script == ''
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_SANITIZER_PACKAGES: ${{ inputs.sanitizer_packages }}
          INPUT_SANITIZER_SUPPRESSIONS: ${{ inputs.sanitizer_suppressions }}
          INPUT_SOURCE_MOUNT: ${{ inputs.source_mount }}
          INPUT_SOURCE_SETUP: ${{ inputs.source_setup }}
        run: |
          SETUP_CMD=""
          if [ -n "${INPUT_SOURCE_SETUP}" ]; then
            SETUP_CMD="${INPUT_SOURCE_SETUP} && "
          fi
          PACKAGES_ARG=""
          if [ -n "${INPUT_SANITIZER_PACKAGES}" ]; then
            PACKAGES_ARG="--packages-select ${INPUT_SANITIZER_PACKAGES}"
          fi
          LSAN_SUPP=""
          if [ -n "${INPUT_SANITIZER_SUPPRESSIONS}" ]; then
            LSAN_SUPP="suppressions=${INPUT_SOURCE_MOUNT}/${INPUT_SANITIZER_SUPPRESSIONS}"
          fi
          docker run --rm \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            -e ASAN_OPTIONS="halt_on_error=1:new_delete_type_mismatch=0:detect_leaks=1" \
            -e UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
            -e LSAN_OPTIONS="$LSAN_SUPP" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "
              ${SETUP_CMD}
              source install/local_setup.bash 2>/dev/null || true
              colcon test \
                --event-handlers console_cohesion+ \
                --return-code-on-test-failure \
                $PACKAGES_ARG
              colcon test-result --verbose
            "

