          fi
          docker run --rm \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "${SETUP_CMD}bash ${INPUT_SANITIZER_SCRIPT}"

