        run: |
          EXT_PATTERN="\.($(echo "${INPUT_FILE_EXTENSIONS}" | tr ' ' '|'))$"
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/${INPUT_BASE_REF}" -- | grep -E "$EXT_PATTERN" || true)
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No C++ files changed."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$FILES" > /tmp/changed_cpp_files.txt
            echo "Found $(echo "$FILES" | wc -l) changed file(s)."
          fi

      - name: Filter excluded paths
        if: steps.changed.outputs.skip == 'false' && inputs.exclude_file != ''
        env:
          INPUT_EXCLUDE_FILE: ${{ inputs.exclude_file }}
        run: |
          EXCLUDE_FILE="${INPUT_EXCLUDE_FILE}"
          FILE_LIST="/tmp/changed_cpp_files.txt"
          if [ -f "$EXCLUDE_FILE" ] && [ -f "$FILE_LIST" ]; then
            PATTERNS=()
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%%#*}"; line="$(echo "$line" | xargs)"
              [ -z "$line" ] && continue
              PATTERNS+=("$line")
            done < "$EXCLUDE_FILE"
            if [ ${#PATTERNS[@]} -gt 0 ]; then
              TEMP=$(mktemp)
              while IFS= read -r fp || [ -n "$fp" ]; do
                [ -z "$fp" ] && continue
                excl=false
                for p in "${PATTERNS[@]}"; do
                  [[ "$fp" == "$p"* ]] && excl=true && break
                done
                [ "$excl" = false ] && echo "$fp"
              done < "$FILE_LIST" > "$TEMP"
              mv "$TEMP" "$FILE_LIST"
              echo "After exclusion filter: $(wc -l < "$FILE_LIST") file(s) remaining."
            fi
            if [ ! -s "$FILE_LIST" ]; then
              echo "All changed files are in excluded paths."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Prepare cache paths
        if: steps.changed.outputs.skip == 'false' && inputs.build_cache_key != ''
        id: cache-paths
        env:
          INPUT_BUILD_CACHE_PATHS: ${{ inputs.build_cache_paths }}
        run: |
          {
            echo "paths<<EOF"
            echo "${INPUT_BUILD_CACHE_PATHS}" | tr ' ' '\n'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        if: steps.changed.outputs.skip == 'false' && inputs.build_cache_key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: ${{ inputs.build_cache_key }}
          restore-keys: |
            ${{ inputs.build_cache_key }}-

      - name: Run IWYU script
        if: steps.changed.outputs.skip == 'false' && inputs.iwyu_script != ''
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref || github.base_ref || 'main' }}
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_IWYU_SCRIPT: ${{ inputs.iwyu_script }}
          INPUT_SOURCE_MOUNT: ${{ inputs.source_mount }}
          INPUT_SOURCE_SETUP: ${{ inputs.source_setup }}
        run: |
          SETUP_CMD=""
          if [ -n "${INPUT_SOURCE_SETUP}" ]; then
            SETUP_CMD="${INPUT_SOURCE_SETUP} && "
          fi
          docker run --rm \
            -e GITHUB_BASE_REF="${INPUT_BASE_REF}" \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "${SETUP_CMD}bash ${INPUT_IWYU_SCRIPT}"

      - name: Run IWYU default flow
        if: steps.changed.outputs.skip == 'false' && inputs.iwyu_script == ''
        id: iwyu
        env:
          INPUT_COMPILE_COMMANDS_PATH: ${{ inputs.compile_commands_path }}
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_IWYU_MAPPING_FILE: ${{ inputs.iwyu_mapping_file }}
          INPUT_SOURCE_MOUNT: ${{ inputs.source_mount }}
          INPUT_SOURCE_SETUP: ${{ inputs.source_setup }}
        run: |
          SETUP_CMD=""
          if [ -n "${INPUT_SOURCE_SETUP}" ]; then
            SETUP_CMD="${INPUT_SOURCE_SETUP} && "
          fi

          MAPPING_ARG=""
          if [ -n "${INPUT_IWYU_MAPPING_FILE}" ]; then
            MAPPING_ARG="-Xiwyu --mapping_file=${INPUT_SOURCE_MOUNT}/${INPUT_IWYU_MAPPING_FILE}"
          fi

          cp /tmp/changed_cpp_files.txt changed_files.txt

          docker run --rm \
            -v "${{ github.workspace }}:${INPUT_SOURCE_MOUNT}" \
            -w "${INPUT_SOURCE_MOUNT}" \
            "${INPUT_DOCKER_IMAGE}" \
            bash -c "
              ${SETUP_CMD}
              if ! command -v include-what-you-use &>/dev/null; then
                echo 'Installing include-what-you-use...'
                apt-get update -qq && apt-get install -y -qq iwyu 2>/dev/null || {
                  echo 'ERROR: Could not install iwyu'
                  exit 1
                }
              fi
              echo \"IWYU version: \$(include-what-you-use --version 2>&1 | head -1 || true)\"
              cat changed_files.txt | while IFS= read -r file; do
                [ -z \"\$file\" ] && continue
                [ -f \"\$file\" ] || continue
                echo \"  IWYU: \$file\"
                include-what-you-use -p ${INPUT_COMPILE_COMMANDS_PATH} $MAPPING_ARG \"\$file\" 2>&1 || true
              done
            " | tee /tmp/iwyu_output.txt || true

          ADD_COUNT=$(grep -c "should add these lines:" /tmp/iwyu_output.txt 2>/dev/null || true)
          REM_COUNT=$(grep -c "should remove these lines:" /tmp/iwyu_output.txt 2>/dev/null || true)
          echo ""
          echo "=== IWYU Summary ==="
          echo "Files with missing includes: $ADD_COUNT"
          echo "Files with unnecessary includes: $REM_COUNT"
          echo "NOTE: This job is non-blocking (report-only)."

