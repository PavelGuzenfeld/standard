name: Python Quality Checks

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        default: '3.12'
        description: 'Python version to use'
      target_python:
        type: string
        default: 'py38'
        description: 'Target Python version for ruff (e.g., py38)'
      python_linter:
        type: string
        default: 'ruff'
        description: 'Linter backend: `ruff` (default, fast) or `flake8` (ROS2/ament compat)'
      source_dirs:
        type: string
        default: 'src'
        description: 'Space-separated source directories'
      test_dirs:
        type: string
        default: 'tests'
        description: 'Space-separated test directories'
      ruff_version:
        type: string
        default: '0.16.9'
        description: 'Ruff version to install; matches the `ruff-pre-commit` pin'
      diff_cover_version:
        type: string
        default: ''
        description: 'diff-cover version to install, for either linter. Empty picks `10.5.1`, or `9.2.0` on Python below 3.10. 9.2.0 has no `ruff.check` driver, so the ruff lint step fails with that reason there; use `python_linter: flake8` or a newer `python_version`'
      ruff_select:
        type: string
        default: 'E,W,F,I,N'
        description: 'Ruff rule selection (comma-separated). Overrides `select` in pyproject.toml'
      ruff_ignore:
        type: string
        default: 'E501'
        description: 'Ruff rules to ignore (comma-separated). Overrides `ignore` in pyproject.toml, so CI agrees with pre-commit; empty ignores nothing'
      enable_tests:
        type: boolean
        default: true
        description: 'Run pytest and collect coverage (disable for projects with external test deps like ROS2)'
      fail_on_dirty_tree:
        type: boolean
        default: false
        description: 'Fail when the tests leave modified or untracked files in the checkout'
      base_ref:
        type: string
        default: ''
        description: 'Base branch for diff comparison (falls back to github.base_ref, then main)'
      fail_under:
        type: string
        default: '100'
        description: 'Minimum diff-quality score (0-100)'
      runner:
        type: string
        default: '"ubuntu-latest"'
        description: 'Runner labels as JSON (e.g., "\"ubuntu-latest\"" or "[\"self-hosted\",\"X64\",\"Linux\"]")'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Install dependencies
        env:
          DIFF_COVER_VERSION_INPUT: ${{ inputs.diff_cover_version }}
          PYTHON_LINTER: ${{ inputs.python_linter }}
          RUFF_VERSION: ${{ inputs.ruff_version }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          DIFF_COVER_VERSION="$DIFF_COVER_VERSION_INPUT"
          if [ -z "$DIFF_COVER_VERSION" ]; then
            if python -c 'import sys; sys.exit(sys.version_info >= (3, 10))'; then
              DIFF_COVER_VERSION=9.2.0
            else
              DIFF_COVER_VERSION=10.5.1
            fi
          fi
          if [ "$PYTHON_LINTER" = "ruff" ]; then
            pip install "ruff==$RUFF_VERSION" "diff-cover==$DIFF_COVER_VERSION"
          else
            if python -c 'import sys; sys.exit(sys.version_info >= (3, 10))'; then
              FLAKE8_VERSION=7.1.2
            else
              FLAKE8_VERSION=7.4.1
            fi
            pip install "flake8==$FLAKE8_VERSION" "diff-cover==$DIFF_COVER_VERSION"
          fi
          pip install pytest pytest-cov pytest-testmon pytest-xdist

      - name: Run diff-aware linting
        id: lint
        env:
          BASE_REF: ${{ inputs.base_ref || github.base_ref || 'main' }}
          FAIL_UNDER: ${{ inputs.fail_under }}
          PYTHON_LINTER: ${{ inputs.python_linter }}
          RUFF_IGNORE: ${{ inputs.ruff_ignore }}
          RUFF_SELECT: ${{ inputs.ruff_select }}
        run: |
          VIOLATIONS="$PYTHON_LINTER"
          OPTIONS=""
          if [ "$VIOLATIONS" = "ruff" ]; then
            VIOLATIONS="ruff.check"
            if ! diff-quality --help | grep -q "ruff.check"; then
              echo "::error::installed diff-cover has no ruff.check driver (needs Python 3.10+); use python_linter: flake8 or a newer python_version"
              exit 1
            fi
            OPTIONS="--select=$RUFF_SELECT"
            if [ -n "$RUFF_IGNORE" ]; then
              OPTIONS="$OPTIONS --ignore=$RUFF_IGNORE"
            fi
          fi
          diff-quality --violations="$VIOLATIONS" \
            --options="$OPTIONS" \
            --compare-branch="origin/$BASE_REF" \
            --fail-under="$FAIL_UNDER"
        continue-on-error: true

      - name: Run tests and collect coverage
        if: inputs.enable_tests
        env:
          TEST_DIRS: ${{ inputs.test_dirs }}
        run: |
          read -ra TEST_DIR_ARGS <<< "$TEST_DIRS"
          pytest "${TEST_DIR_ARGS[@]}" \
            --cov --cov-report=xml --verbose

      - name: Fail if tests dirtied the working tree
        if: inputs.enable_tests && inputs.fail_on_dirty_tree
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::Tests modified or created files in the checkout:"
            echo "$dirty"
            exit 1
          fi

      - name: Generate diff coverage report
        if: inputs.enable_tests
        id: diff-cover
        env:
          BASE_REF: ${{ inputs.base_ref || github.base_ref || 'main' }}
        run: |
          echo "DIFF_COVER_REPORT<<EOF" >> "$GITHUB_ENV"
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --markdown-report=diff-cover.md || true
          cat diff-cover.md >> "$GITHUB_ENV" 2>/dev/null || \
            diff-cover coverage.xml \
              --compare-branch="origin/$BASE_REF" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Set lint outcome
        id: lint-result
        run: echo "outcome=${{ steps.lint.outcome }}" >> "$GITHUB_OUTPUT"

    outputs:
      lint_outcome: ${{ steps.lint.outcome }}

  summary:
    name: Post Summary
    runs-on: ${{ fromJSON(inputs.runner) }}
    needs: [lint-and-test]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- python-quality-report -->';
            const lintResult = '${{ needs.lint-and-test.outputs.lint_outcome }}';
            const output = process.env.DIFF_COVER_REPORT || '';

            const icon = (r) => {
              if (r === 'success') return '✅';
              if (r === 'skipped') return '⏭️';
              if (r === 'failure') return '❌';
              return '⚠️';
            };

            let body = marker + '\n## Python Quality Scoreboard\n\n';
            body += '| Check | Result |\n|:------|:------:|\n';
            body += `| ${{ inputs.python_linter }} lint | ${icon(lintResult)} ${lintResult === 'success' ? 'clean' : 'issues found'} |\n`;

            if (output) {
              body += '\n' + output;
            }

            body += '\n\n---\n<sub>Powered by <a href="https://github.com/PavelGuzenfeld/standard">standard</a> · Only changed lines checked</sub>';

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }

      - name: Fail if lint issues found
        if: needs.lint-and-test.outputs.lint_outcome == 'failure'
        run: |
          echo "Linter found issues in changed lines."
          exit 1
