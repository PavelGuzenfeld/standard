name: Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  python-quality:
    uses: ./.github/workflows/python-quality.yml
    with:
      python_version: '3.12'
      python_linter: 'ruff'
      source_dirs: 'src'
      test_dirs: 'tests'
    permissions:
      contents: read
      pull-requests: write

  layering:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: sudo apt-get install -y jq
      - run: pip install -q import-linter ast-grep-cli
      - run: bash tests/test_layering.sh

  test-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/test_test_mirror.sh

  ts-naming:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./actions/ts-naming
      - run: pip install -q gdtoolkit
      - run: bash tests/test_patterns.sh
